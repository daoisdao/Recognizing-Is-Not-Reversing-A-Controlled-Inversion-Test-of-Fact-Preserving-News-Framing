project:
  name: social-framing-inversion-icassp-core
  target: ICASSP-2027
  seed: 20260906
  prompt_version: final-v2.2-glm52
sample:
  pilot_sources: 10
  final_sources: 60
  canonical_words_min: 180
  canonical_words_max: 260
  atomic_facts_min: 6
  atomic_facts_max: 10
models:
  generator_family: glm5.2
  evaluated_families:
  - qwen
  - deepseek
  - kimi
  reasoning_ablation_families:
  - qwen
  - deepseek
  - kimi
operators:
  active:
  - lexical_affective
  - agency_prominence
  - salience_order
  strengths:
  - low
  - medium
  - high
  direction_assignment: balanced
tasks:
  blind_detection: true
  blind_reconstruction: true
  clean_control: true
  reasoning_ablation_high_only: true
inference:
  temperature: 0.0
  main_reasoning: off_or_minimum
  tools: false
  web: false
  n: 1
  detection_max_output_tokens: 300
  reconstruction_max_output_tokens: 500
evaluation:
