  - model_ids
  - prompts
  - operator_definitions
  - strength_definitions
  - primary_metrics
  - reasoning_conditions
  - analysis_plan
  report_all_models: true
  report_all_operators: true
  report_all_strengths: true
  report_all_reasoning_results: true
  pilot_excluded_from_final_statistics: true
  no_model_swaps_after_full_run_starts: true
  no_primary_metric_changes_after_full_run_starts: true
  no_prompt_changes_after_full_run_starts: true
